<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Budget Manager</h2>
        
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-success text-white">
                    <div class="card-body">
                        <h5>Total Income</h5>
                        <h3 id="summary-income">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger text-white">
                    <div class="card-body">
                        <h5>Total Expenses</h5>
                        <h3 id="summary-expense">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-primary text-white">
                    <div class="card-body">
                        <h5>Current Balance</h5>
                        <h3 id="summary-balance">$0.00</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header">Add Transaction</div>
                    <div class="card-body">
                        <form id="tx-form">
                            <div class="mb-3">
                                <label class="form-label">Type</label>
                                <select class="form-select" id="tx-type">
                                    <option value="expense">Expense</option>
                                    <option value="income">Income</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" id="tx-date" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Amount</label>
                                <input type="number" step="0.01" class="form-control" id="tx-amount" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Category</label>
                                <input type="text" class="form-control" id="tx-category" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <input type="text" class="form-control" id="tx-description">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save Transaction</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">Recent Transactions</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="tx-list">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('tx-date').valueAsDate = new Date();

        async function loadData() {
            // Load Summary
            const sumRes = await fetch('/api/summary');
            const summary = await sumRes.json();
            document.getElementById('summary-income').innerText = `$${summary.total_income.toFixed(2)}`;
            document.getElementById('summary-expense').innerText = `$${summary.total_expense.toFixed(2)}`;
            document.getElementById('summary-balance').innerText = `$${summary.balance.toFixed(2)}`;

            // Load Transactions
            const txRes = await fetch('/api/transactions');
            const transactions = await txRes.json();
            const list = document.getElementById('tx-list');
            list.innerHTML = '';
            
            transactions.forEach(tx => {
                const colorClass = tx.type === 'income' ? 'text-success' : 'text-danger';
                list.innerHTML += `
                    <tr>
                        <td>${tx.date}</td>
                        <td><span class="badge ${tx.type === 'income' ? 'bg-success' : 'bg-danger'}">${tx.type}</span></td>
                        <td>${tx.category}</td>
                        <td>${tx.description}</td>
                        <td class="${colorClass}">$${tx.amount.toFixed(2)}</td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="deleteTx(${tx.id})">Del</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('tx-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                type: document.getElementById('tx-type').value,
                date: document.getElementById('tx-date').value,
                amount: document.getElementById('tx-amount').value,
                category: document.getElementById('tx-category').value,
                description: document.getElementById('tx-description').value,
            };

            await fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            e.target.reset();
            document.getElementById('tx-date').valueAsDate = new Date();
            loadData();
        });

        async function deleteTx(id) {
            if(confirm('Delete this transaction?')) {
                await fetch(`/api/transactions/${id}`, { method: 'DELETE' });
                loadData();
            }
        }

        // Initial Load
        loadData();
    </script>
</body>
</html>
